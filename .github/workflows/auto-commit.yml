name: Auto Commit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update activity
        run: |
          echo "Last automated commit: $(date -u)" >> .github/activity.log
      - name: Commit and push
        run: |
          git config --local user.email "bot@pagewatch.tech"
          git config --local user.name "pagewatch-bot"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-commit $(date -u +%Y-%m-%d)"
          git push